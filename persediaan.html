<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoKitchen - Kelola Produksi Lebih Berkelanjutan</title>
    <meta name="description"
        content="Kelola persediaan bahan, rencanakan produksi, dan pantau limbah dalam satu dashboard.">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Inter", sans-serif;
            --color-eco-50: #f0fdf4;
            --color-eco-100: #dcfce7;
            --color-eco-600: #16a34a;
            --color-eco-700: #15803d;
            --color-eco-800: #166534;
            --color-eco-900: #14532d;
        }
    </style>
</head>

<body class="bg-white font-sans text-slate-800 antialiased">

    <header class="sticky top-0 z-50 border-b border-slate-100 bg-white/95 backdrop-blur">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 lg:px-8">

            <a href="#" class="flex items-center gap-2">
                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-eco-700 text-xl text-white">
                    🌿
                </span>
                <span class="text-xl font-extrabold tracking-tight text-eco-900">
                    EcoKitchen
                </span>
            </a>

            <div class="hidden items-center gap-8 md:flex">
                <a href="beranda.html" class="text-sm font-medium text-slate-600 transition hover:text-eco-700">
                    Beranda
                </a>
                <a href="persediaan.html" class="text-sm font-medium text-slate-600 transition hover:text-eco-700">
                    Persediaan
                </a>
                <a href="produksi.html" class="text-sm font-medium text-slate-600 transition hover:text-eco-700">
                    Produksi
                </a>
                <a href="limbah.html" class="text-sm font-medium text-slate-600 transition hover:text-eco-700">
                    Limbah
                </a>
            </div>

        </nav>
    </header>

    <main class="pb-24">
        <section>
            <h1 class="mt-2 text-[26px] font-extrabold tracking-tight text-slate-800 sm:text-3xl">
                PERSEDIAAN
            </h1>

            <p id="tanggal" class="mt-1.5 text-xs text-slate-500 sm:text-sm">
                Ringkasan dapur hari ini
            </p>
        </section>
        <section class="mt-5">
            <div class="relative">
                <svg class="absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7">
                    <circle cx="10.8" cy="10.8" r="6.8"></circle>
                    <path d="m16 16 4.5 4.5"></path>
                </svg>

                <input
                    id="search-input"
                    type="search"
                    placeholder="Cari bahan pangan"
                    autocomplete="off"
                    class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-10 pr-12 text-sm outline-none transition placeholder:text-slate-400 focus:border-eco-600 focus:ring-2 focus:ring-eco-100"
                >

                <button id="toggle-filters"
                        type="button"
                        aria-label="Fokus ke filter persediaan"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-eco-700 hover:text-eco-900">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.7">
                        <path d="M4 7h9m4 0h3M4 17h3m4 0h9"></path>
                        <circle cx="15" cy="7" r="2"></circle>
                        <circle cx="9" cy="17" r="2"></circle>
                    </svg>
                </button>
            </div>
        </section>
        <section id="filter-section" class="mt-4">
            <div class="flex flex-wrap gap-2" role="group" aria-label="Filter status bahan">

                <button data-filter="semua"
                        class="filter-btn active rounded-full bg-eco-50 px-3 py-1.5 text-[11px] font-semibold text-eco-800 transition">
                    Semua <span id="count-semua">6</span>
                </button>

                <button data-filter="aman"
                        class="filter-btn rounded-full bg-eco-50 px-3 py-1.5 text-[11px] font-semibold text-slate-600 transition hover:bg-eco-100">
                    Aman · <span id="count-aman">3</span>
                </button>

                <button data-filter="perhatian"
                        class="filter-btn rounded-full bg-eco-50 px-3 py-1.5 text-[11px] font-semibold text-slate-600 transition hover:bg-eco-100">
                    Perhatian · <span id="count-perhatian">3</span>
                </button>

            </div>
        </section>
        <section class="mt-5">

            <div class="mb-3 flex items-center justify-between">
                <h2 class="text-sm font-extrabold text-slate-800 sm:text-base">
                    Bahan di dapur
                </h2>

                <span id="total-label" class="text-[11px] text-slate-500">
                    6 bahan
                </span>
            </div>

            <div id="ingredient-list"
                 class="grid grid-cols-1 gap-2.5 sm:grid-cols-2 sm:gap-4 xl:grid-cols-3">

                <!-- Kartu dihasilkan JavaScript -->

            </div>

            <div id="empty-state"
                 class="hidden rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center">
                <p class="text-2xl">🔎</p>
                <h3 class="mt-3 font-bold text-slate-800">Bahan tidak ditemukan</h3>
                <p class="mt-1 text-sm text-slate-500">
                    Coba gunakan nama bahan atau filter lainnya.
                </p>

                <button id="reset-filter"
                        class="mt-4 rounded-xl bg-eco-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-eco-800">
                    Reset pencarian
                </button>
            </div>

        </section>
        <footer class="mt-5 pb-2">
            <p class="text-[10px] leading-5 text-eco-700">
                Utamakan bahan berstatus pakai dekat.
            </p>
            <p class="text-[10px] leading-5 text-slate-500">
                Ikon QR membuka aksi data bahan.
            </p>
        </footer>
    </main>
    <div class="fixed inset-x-0 bottom-0 z-50 border-t border-slate-200 bg-white/95 backdrop-blur md:hidden">
        <nav class="mx-auto grid max-w-md grid-cols-5">
            <a href="beranda.html" class="mobile-tab active flex flex-col items-center justify-center gap-1 py-2 text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.5 12 3l9 7.5"/>
                    <path d="M5 9.5V21h14V9.5"/>
                </svg>
                <span class="text-[11px] font-medium">Beranda</span>
                <span class="active-line mt-1 hidden h-[3px] w-10 rounded-full bg-slate-900"></span>
            </a>

            <a href="persediaan.html" class="mobile-tab flex flex-col items-center justify-center gap-1 py-2 text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/>
                    <path d="M8 5v4m8-4v4M4 11h16"/>
                </svg>
                <span class="text-[11px] font-medium">Persediaan</span>
                <span class="active-line mt-1 hidden h-[3px] w-10 rounded-full bg-slate-900"></span>
            </a>

            <a href="produksi.html" class="mobile-tab flex flex-col items-center justify-center gap-1 py-2 text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 18V7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5V18"/>
                    <path d="M8 9h8m-8 4h8M8 18h8"/>
                </svg>
                <span class="text-[11px] font-medium">Produksi</span>
                <span class="active-line mt-1 hidden h-[3px] w-10 rounded-full bg-slate-900"></span>
            </a>

            <a href="limbah.html" class="mobile-tab flex flex-col items-center justify-center gap-1 py-2 text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M8 6V4h8v2"/>
                    <path d="M19 6l-1 14H6L5 6"/>
                    <path d="M10 11v5M14 11v5"/>
                </svg>
                <span class="text-[11px] font-medium">Limbah</span>
                <span class="active-line mt-1 hidden h-[3px] w-10 rounded-full bg-slate-900"></span>
            </a>

            <a href="#laporan.html" class="mobile-tab flex flex-col items-center justify-center gap-1 py-2 text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 20V8m7 12V4m7 16v-9"/>
                    <path d="M3 20h18"/>
                </svg>
                <span class="text-[11px] font-medium">Laporan</span>
                <span class="active-line mt-1 hidden h-[3px] w-10 rounded-full bg-slate-900"></span>
            </a>
        </nav>
    </div>

    <style>
        .mobile-tab.active {
            color: #0f172a;
        }

        .mobile-tab.active .active-line {
            display: block;
        }
    </style>

    <script src="js/script.js"></script>
</body>
<div id="toast"
     role="status"
     class="fixed bottom-24 left-1/2 z-[60] hidden -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-3 text-center text-xs text-white shadow-lg md:bottom-6">
</div>
</html>
